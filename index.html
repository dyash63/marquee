<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12162A" />
  <title>Marquee</title>
  <style>html,body{margin:0;background:#12162A;min-height:100%}#boot{color:#9AA0BE;font-family:Inter,system-ui,sans-serif;padding:2rem;text-align:center}</style>
</head>
<body>
  <p id="boot">Loading Marquee…</p>
  <script>
  (async function () {
    var boot = document.getElementById('boot');
    var n = 35;
    try {
      var parts = await Promise.all(
        Array.from({ length: n }, function (_, i) {
          var name = 'part' + String(i).padStart(2, '0') + '.txt';
          return fetch(name + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
            if (!r.ok) throw new Error(name + ' HTTP ' + r.status);
            return r.text();
          });
        })
      );
      var html = parts.join('');
      if (html.indexOf('marquee-app') === -1) throw new Error('Bad reconstruct');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      console.error(e);
      if (boot) boot.innerHTML = 'Failed to load Marquee.<br><small>' + String(e && e.message || e) + '</small>';
    }
  })();
  </script>
</body>
</html>
